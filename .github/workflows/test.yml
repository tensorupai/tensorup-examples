name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      samples: ${{ steps.find.outputs.samples }}
    steps:
      - uses: actions/checkout@v7
      - id: find
        # Every top-level folder with a pyproject.toml is a sample.
        run: echo "samples=$(ls -d */pyproject.toml | xargs -n1 dirname | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  test:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sample: ${{ fromJson(needs.discover.outputs.samples) }}
    defaults:
      run:
        working-directory: ${{ matrix.sample }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - run: uv run pytest -q
