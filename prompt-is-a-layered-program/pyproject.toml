[project]
name = "promptlayers"
version = "0.1.0"
description = "A prompt as a layered program, compiled per model through LiteLLM (TensorUp sample)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "litellm==1.106.0",
    "pydantic==2.14.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/promptlayers"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
