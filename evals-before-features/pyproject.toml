[project]
name = "supportevals"
version = "0.1.0"
description = "Evals before features: a Strands harness support agent tested with Strands Evals (TensorUp sample)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # No [openai] extra on the harness: it caps openai below 3.0; the SDK extra allows 3.x.
    "strands-harness==0.3.4",
    "strands-agents[openai,anthropic]==1.64.0",
    "strands-agents-evals==1.9.0",
    "openai==3.46.0",
    "anthropic==0.125.0",  # the SDK extra caps anthropic below 1.0
    "python-dotenv==1.2.4",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supportevals"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
